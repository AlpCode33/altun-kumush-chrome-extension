name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check popup.js

      - name: Validate manifest and referenced files
        run: |
          node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); const files = [manifest.action.default_popup, ...Object.values(manifest.icons)]; const missing = files.filter((file) => !fs.existsSync(file)); if (missing.length) { console.error('Missing extension files:', missing.join(', ')); process.exit(1); }"